name: 'Build Static Export'
description: 'Build the Next.js static export'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Prefer IPv4 for npm registry
      shell: bash
      run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build static export
      shell: bash
      run: |
        export NEXT_DISABLE_SWC_BINARY=1
        export NEXT_CACHE_DIR="$(pwd)/.next-cache"
        rm -rf .next-cache .next out
        mkdir -p .next-cache
        bun run build
