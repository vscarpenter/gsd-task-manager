name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: |
          set +e
          bun audit --audit-level=high --json > audit-results.json 2> audit-errors.log
          AUDIT_EXIT=$?
          node scripts/check-audit-results.cjs audit-results.json
          CHECK_EXIT=$?
          set -e

          if [ "$CHECK_EXIT" -eq 1 ]; then
            echo "has_vulnerabilities=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "has_vulnerabilities=false" >> "$GITHUB_OUTPUT"
          if [ "$CHECK_EXIT" -ne 0 ] || [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "Security audit did not produce clean, valid evidence." >&2
            sed -n '1,80p' audit-errors.log >&2
            exit 1
          fi

      - name: Audit summary
        if: always()
        run: |
          echo "### Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outputs.has_vulnerabilities }}" = "true" ]; then
            echo "⚠️ High or critical vulnerabilities found. See audit step above." >> $GITHUB_STEP_SUMMARY
          elif [ -s audit-results.json ]; then
            echo "See detailed results in the audit step above." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi
