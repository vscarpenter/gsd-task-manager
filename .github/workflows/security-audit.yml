name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$ARCHIVE"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Scan full Git history for secrets
        run: gitleaks git --redact --log-opts="--all"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: |
          set +e
          bun audit --audit-level=high --json > audit-results.json 2> audit-errors.log
          AUDIT_EXIT=$?
          node scripts/check-audit-results.cjs audit-results.json
          CHECK_EXIT=$?
          set -e

          if [ "$CHECK_EXIT" -eq 1 ]; then
            echo "has_vulnerabilities=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "has_vulnerabilities=false" >> "$GITHUB_OUTPUT"
          if [ "$CHECK_EXIT" -ne 0 ] || [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "Security audit did not produce clean, valid evidence." >&2
            sed -n '1,80p' audit-errors.log >&2
            exit 1
          fi

      - name: Audit summary
        if: always()
        run: |
          echo "### Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outputs.has_vulnerabilities }}" = "true" ]; then
            echo "⚠️ High or critical vulnerabilities found. See audit step above." >> $GITHUB_STEP_SUMMARY
          elif [ -s audit-results.json ]; then
            echo "See detailed results in the audit step above." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi
