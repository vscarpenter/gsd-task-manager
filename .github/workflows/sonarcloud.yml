name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# IMPORTANT: Before this workflow will succeed, you must disable SonarCloud's
# "Automatic Analysis" for this project. Go to:
# https://sonarcloud.io/project/admin/analysis_method?id=vscarpenter_gsd-task-manager
# and toggle "Automatic Analysis" OFF. This is a one-time manual step.

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history required for SonarCloud blame data and new code detection
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # `bun run` executes Vitest on Node; pin the floor line instead of the image default.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test -- --coverage --reporter=verbose
        env:
          CI: true

      - name: Run MCP server tests with coverage
        # The MCP package has its own vitest suite (separate from the root app).
        # Generate its lcov and rewrite the SF paths to be repo-root-relative so
        # SonarCloud — which scans from the repo root — maps coverage onto
        # packages/mcp-server source. The package's own thresholds are blocking.
        run: |
          bun run --cwd packages/mcp-server test:coverage
          sed -i 's|^SF:src/|SF:packages/mcp-server/src/|' packages/mcp-server/coverage/lcov.info
        env:
          CI: true

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
