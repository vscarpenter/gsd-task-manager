name: Publish MCP Server

on:
  push:
    tags:
      - 'mcp-v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + pack, no publish)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: mcp-release
      url: https://www.npmjs.com/package/gsd-mcp-server
    defaults:
      run:
        working-directory: packages/mcp-server

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify publish ref is reviewed
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual publish must run from the main branch."
            exit 1
          fi

          RELEASE_COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "::error::Publish commit $RELEASE_COMMIT is not reachable from origin/main"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # No registry-url here: setup-node's registry-url writes an .npmrc that
      # references ${NODE_AUTH_TOKEN}, which npm errors on when the var is
      # unset. Trusted publishing needs no .npmrc — npm >=11.5.1 (Node 24)
      # exchanges the workflow's OIDC token with npmjs directly.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_REF#mcp-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Typecheck (workspace)
        working-directory: ${{ github.workspace }}
        run: bun typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Auth is OIDC trusted publishing (id-token: write above + the trusted
      # publisher configured on npmjs.com for this repo/workflow/environment).
      # No long-lived token: nothing to expire, nothing to leak.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public

      - name: Dry-run pack (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          npm pack --dry-run
          echo "Dry run complete — no publish performed"
