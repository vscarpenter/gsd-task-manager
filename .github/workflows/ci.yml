name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# In-flight CI runs on the same ref get cancelled when a new push arrives.
# Saves CI minutes; safe because CI is a pure gate (no side effects).
# Deploy workflows do the opposite: cancel-in-progress: false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Enforce code-shape baseline
        run: bun run quality:shape

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Enforce dependency licenses and generate SBOM
        run: bun run license:check -- --sbom "$RUNNER_TEMP/gsd-taskmanager.cdx.json"
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: ${{ runner.temp }}/gsd-taskmanager.cdx.json
          retention-days: 30
      - name: Test
        run: bun run test -- --coverage
        env:
          CI: true

  mcp-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test MCP server with coverage
        run: bun run --cwd packages/mcp-server test:coverage
        env:
          CI: true

  pocketbase-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for browser/PocketBase boundary test
        run: bunx playwright install --with-deps chromium
      - name: Run authenticated PocketBase system test
        run: bun run test:system:pocketbase

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Prefer IPv4 for npm registry
        run: echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} end-to-end tests
        run: bun run test:e2e -- --project=${{ matrix.browser }} --reporter=line,html
        env:
          CI: true
      - name: Build production export for strict CSP smoke test
        if: matrix.browser == 'chromium'
        run: bun run build
      - name: Boot production export under strict CSP
        if: matrix.browser == 'chromium'
        run: bun run test:csp
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      # Only upload the artifact on pushes to main (and only if the build
      # succeeds). PR builds verify the build still works but don't produce
      # deployable artifacts. Phase 3's deploy-dev workflow will consume the
      # artifact uploaded here via workflow_run + actions/download-artifact.
      - uses: ./.github/actions/build-static-export
        with:
          artifact-name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('static-export-{0}', github.sha) || '' }}
