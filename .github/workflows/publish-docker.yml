name: Publish Docker Image

# Builds the self-hosted image (docker/Dockerfile: Caddy + PocketBase + static site)
# and publishes it to GHCR and Docker Hub.
#
#   push to main      -> :edge and :sha-<short>   (moving + immutable "latest commit")
#   push tag vX.Y.Z   -> :X.Y.Z, :X.Y, :latest    (release)
# Grype scans the amd64 image before any registry login. The findings land in
# the job summary and in the image-vulnerability-report artifact.
# GHCR auth uses the built-in GITHUB_TOKEN. Docker Hub is published only when the
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets are configured, so the workflow
# stays correct even if those secrets are absent.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Jobs opt in to token scopes; a new job starts with none.
permissions: {}

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # The release waits on the dependency audit (SEC-030).
  audit:
    name: Security audit
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml

  publish:
    needs: audit
    runs-on: ubuntu-24.04
    # Successful runs take up to 11 minutes. Without a limit, a hung build
    # holds the runner for GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GRYPE_VERSION: 0.121.3
      GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure build
        id: cfg
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO: ${{ github.repository }}
        run: |
          # Registries: GHCR always; Docker Hub only when its secret is configured.
          IMAGES="ghcr.io/${REPO}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="${IMAGES}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/gsd-task-manager"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          echo "push_enabled=true" >> "$GITHUB_OUTPUT"

          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          TAG_VERSION="${TAG_REF#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          RELEASE_COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "::error::Release commit $RELEASE_COMMIT is not reachable from origin/main"
            exit 1
          fi
          echo "Publishing release $PKG_VERSION"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.cfg.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build one platform into the local Docker engine so Grype can read it.
      # The multi-platform build below reuses these layers.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: gsd-task-manager:scan
          cache-from: type=gha
          provenance: false

      - name: Install pinned Grype
        run: |
          ARCHIVE="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/$ARCHIVE"
          echo "$GRYPE_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" grype
          sudo install "$RUNNER_TEMP/grype" /usr/local/bin/grype

      # The scan reports findings and does not fail on them. The step fails
      # only when Grype cannot run, so no unscanned image reaches a registry.
      - name: Scan image for vulnerabilities
        run: |
          grype docker:gsd-task-manager:scan \
            -o json="$RUNNER_TEMP/grype-report.json" -o table

      - name: Vulnerability summary
        run: |
          {
            echo "### Image vulnerability scan"
            echo ""
            echo "| Severity | Findings | With a fix |"
            echo "|---|---|---|"
            jq -r '
              ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"][] as $severity
              | [.matches[] | select(.vulnerability.severity == $severity)] as $found
              | "| \($severity) | \($found | length) | \([$found[] | select(.vulnerability.fix.state == "fixed")] | length) |"
            ' "$RUNNER_TEMP/grype-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-vulnerability-report
          path: ${{ runner.temp }}/grype-report.json
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: steps.cfg.outputs.push_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.cfg.outputs.push_enabled == 'true' && steps.cfg.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Docker image"
            echo "Pushed the following tags:"
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
