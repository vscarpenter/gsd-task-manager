\* The code, plus one save from a client whose clock runs over 5 minutes fast,
\* checked only for the far-future hold-off. One tick fewer than the main
\* config keeps the full run under a minute. Expected: UnsentEditStays holds.
SPECIFICATION Spec
CONSTANTS
  MaxTime = 3
  MaxQueue = 2
  MaxRetries = 2
  Overlap = 1
  Ceiling = 10
  OtherTasks = FALSE
  LostEvents = TRUE
  RunOut = FALSE
  PushOverlap = FALSE
  FastClock = TRUE
  Variant = "code"
INVARIANT TypeOK
INVARIANT UnsentEditStays
