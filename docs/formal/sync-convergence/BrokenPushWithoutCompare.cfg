\* Replays the bug 40a8bc5 fixed: the server writes without comparing the version
\* the push read, so a stale push overwrites a newer edit. Expected:
\* QuietMeansSameCopy breaks.
SPECIFICATION Spec
CONSTANTS
  MaxTime = 4
  MaxQueue = 2
  MaxRetries = 2
  Overlap = 1
  Ceiling = 10
  OtherTasks = FALSE
  LostEvents = TRUE
  RunOut = FALSE
  PushOverlap = TRUE
  FastClock = FALSE
  Variant = "push-without-compare"
INVARIANT TypeOK
INVARIANT QuietMeansSameCopy
INVARIANT QuietMeansNewestEdit
INVARIANT UnsentEditStays
