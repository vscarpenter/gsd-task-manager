<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">GSD favicon</title>
  <style>
    .frame { fill: none; stroke: #5C4F7D; stroke-width: .5; opacity: .4 }
